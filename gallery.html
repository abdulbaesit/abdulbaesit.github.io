<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gallery · Abdul Basit</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body data-variant="editorial">
    <a href="#main" class="skip-link">Skip to content</a>

    <header class="site-header">
        <nav class="nav" aria-label="Primary">
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="gallery.html" class="nav-link" aria-current="page">Gallery</a>
            </div>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </nav>
    </header>

    <main id="main">
        <section class="block block-top">
            <div class="wrap">
                <h1 class="block-title"><span>Gallery <span class="ur">/ تصاویر</span></span></h1>
                <p class="gallery-note">Media is loaded only on demand. HEIC files may not preview in some browsers; use Safari or download.</p>

                <div class="gallery-controls">
                    <button class="gallery-btn" data-filter="all">All</button>
                    <button class="gallery-btn" data-filter="image">Photos</button>
                    <button class="gallery-btn" data-filter="video">Videos</button>
                    <button id="load-media-btn" class="gallery-btn primary">Load Collection</button>
                </div>

                <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
            </div>
        </section>
    </main>

    <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog">
        <button type="button" class="lightbox-close" aria-label="Close">✕</button>
        <button type="button" class="lightbox-nav lightbox-prev" aria-label="Previous">❮</button>
        <button type="button" class="lightbox-nav lightbox-next" aria-label="Next">❯</button>
        <div class="lightbox-content" id="lightbox-content"></div>
    </div>

    <script src="site.js"></script>
    <!-- HEIC to JPEG converter (WASM) for cross-browser previews -->
    <script src="https://unpkg.com/heic2any/dist/heic2any.min.js"></script>
    <script src="gallery.js"></script>
</body>

</html>
